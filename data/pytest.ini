[pytest]
# Puts data/ on sys.path so test modules and the notebook libs they import can do
# `from utils.data_utils import ...`, the same way the notebooks do.
# 2026/partners is on the path for the same reason: a partner lib does `import
# partners_lib`, which pytest would otherwise only resolve for the shared tests
# sitting in that folder.
pythonpath = . 2026/partners
