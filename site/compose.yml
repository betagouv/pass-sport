  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: passsport
      POSTGRES_PASSWORD: passsport
      POSTGRES_DB: passsport
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U passsport -d passsport']
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  pgdata:
