---
# scalingo (comme la CLI installée par scalingo.yml) vit dans /usr/local/bin. En session
# interactive c'est déjà sur le PATH, par deux mécanismes système indépendants
# (/etc/login.defs ENV_PATH, /etc/environment) — mais la crontab d'un utilisateur suit
# SES PROPRES règles, et le paquet `cron` de Debian a changé de comportement entre
# versions récentes (son changelog montre des allers-retours sur ce qu'il met dans le
# PATH par défaut). Sans cette ligne, `command -v scalingo` dans run_fc_pipeline.sh
# échouerait selon la version du paquet installée — silencieusement, jusqu'au premier
# passage de cron. `job:` porte la VALEUR quand `env: true`, ce n'est pas une commande.
- name: PATH de la crontab (scalingo vit dans /usr/local/bin)
  become: true
  ansible.builtin.cron:
    name: PATH
    env: true
    job: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    user: "{{ pass_sport_user }}"

# `name` porte l'idempotence : rejouer ne duplique pas la ligne, contrairement à un
# crontab édité à la main. Posée DÉSACTIVÉE tant que pass_sport_fc_cron_enabled n'est
# pas passé à true : voir l'en-tête de lamp-setup.yml.
# Tag `fc-cron`, distinct de ce réglage : `--skip-tags fc-cron` saute la tâche entièrement
# (rien posé, rien à retirer), là où pass_sport_fc_cron_enabled ne fait que commenter une
# entrée déjà posée. Sert à reporter tout le volet FC — le reste du provisioning tourne.
- name: Passage FranceConnect toutes les 6 heures
  become: true
  ansible.builtin.cron:
    name: pass-sport-fc
    user: "{{ pass_sport_user }}"
    minute: '30'
    hour: '0,6,12,18'
    job: "{{ pass_sport_repo }}/data/2026/partners/franceconnect/run_fc_pipeline.sh"
    disabled: "{{ not pass_sport_fc_cron_enabled }}"
  tags: [fc-cron]

# Referme la boucle des codes fabriqués par la cron ci-dessus : elle marque les bénéficiaires en
# 'eligible_pending_lca' et dépose un CSV, un humain l'injecte chez LCA, et ce passage-ci
# redemande à LCA si elle les sert enfin — auquel cas le verdict passe à 'eligible_confirmed' et
# le site affiche le code. Rien du traitement n'a lieu sur cette machine : le script pose un job
# BullMQ et le worker Scalingo fait le reste (worker/src/jobs/lca-checks.ts).
#
# Horaire paramétré, pas en dur : la bonne cadence dépend du délai réel d'injection chez LCA, qui
# ne se connaîtra qu'en production. `10,40` et non `*/30` pour éviter la minute 30, où
# pass-sport-fc monte son propre tunnel Scalingo quatre fois par jour — les deux crons se
# croiseraient sinon, et la seconde échouerait.
#
# Posée DÉSACTIVÉE comme pass-sport-fc, même procédure d'activation (voir lamp-setup.yml).
- name: Vérification des eligible_pending_lca (toutes les 30 minutes par défaut)
  become: true
  ansible.builtin.cron:
    name: pass-sport-lca-checks
    user: "{{ pass_sport_user }}"
    minute: "{{ pass_sport_lca_checks_cron_minute }}"
    hour: "{{ pass_sport_lca_checks_cron_hour }}"
    job: "{{ pass_sport_repo }}/worker/src/scripts/run-lca-checks.sh"
    disabled: "{{ not pass_sport_lca_checks_cron_enabled }}"
  tags: [lca-checks-cron]

- name: Unité systemd qf-batch (templatée par partenaire)
  become: true
  ansible.builtin.template:
    src: 'pass-sport-qf-batch@.service.j2'
    dest: '/etc/systemd/system/pass-sport-qf-batch@.service'
    mode: '0644'
  notify: daemon-reload
  # Tag dédié : redéployer juste ce fichier (ex. après un changement de QF_RATE) avec
  # `--tags qf-batch-systemd`, sans rejouer tout le reste du provisioning.
  tags: [qf-batch-systemd]
  # Volontairement pas de `systemctl enable`/`state: started` ici : qf-batch se déclenche
  # à la main, un partenaire à la fois (`systemctl start pass-sport-qf-batch@msa`),
  # jamais tout seul à l'installation ni au démarrage de la machine.
