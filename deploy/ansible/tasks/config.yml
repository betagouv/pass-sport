---
# Toutes les variables de run_fc_pipeline.sh (SCALINGO_APP/SCALINGO_API_TOKEN compris) vivent
# désormais dans data/.env, à la main sur la machine — hors du champ de ce playbook (voir
# deploy/ansible/README.md). run_fc_pipeline.sh ne source plus que data/.env : sur une machine
# déjà provisionnée par une version antérieure du playbook, /etc/default/pass-sport-fc n'est
# donc plus lu — mais il resterait sur le disque avec un jeton Scalingo dedans si on ne le
# retirait pas explicitement ici.
# Tag `fc-cron`, partagé avec la tâche crontab de tasks/ordonnancement.yml : `--skip-tags
# fc-cron` reporte le volet FC en bloc.
- name: Retrait de l'ancien /etc/default/pass-sport-fc
  become: true
  ansible.builtin.file:
    path: /etc/default/pass-sport-fc
    state: absent
  tags: [fc-cron]

- name: Dossier de dépôt inscriptible
  ansible.builtin.command: "test -w {{ fc_prod_drop_dir }}"
  changed_when: false
  tags: [fc-cron]
  # Le montage NFS n'est pas géré ici : il appartient à l'infra, on vérifie seulement que
  # le passage FC ne mourra pas au dernier moment, après avoir marqué la base.
