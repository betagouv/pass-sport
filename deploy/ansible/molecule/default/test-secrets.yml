# Secrets de TEST pour ce scénario Molecule uniquement. SCALINGO_APP/SCALINGO_API_TOKEN ne
# sont plus des variables du playbook (elles vivent dans data/.env, hors de son champ) : rien
# à fournir ici pour elles. `pass_sport_fc_cron_enabled` est explicitement forcé à `false` —
# le défaut du playbook est désormais `true`, et cette machine jetable ne doit jamais appeler
# l'API Scalingo pour de vrai.
#
# Noms d'opérateurs inventés par syllabes, sans rapport avec de vraies personnes — même
# principe que les autres fixtures de test du dépôt (voir data/utils/test_codes_utils.py).
pass_sport_fc_cron_enabled: false
pass_sport_operators:
  - kelvao
  - brindu
