---
# Provisioning de la machine de traitement pass Sport : qf-batch (worker/) et le passage
# FranceConnect (data/2026/partners/franceconnect/).
#
# Joué SUR la machine elle-même, jamais depuis un nœud de contrôle distant : l'accès passe
# par un bastion à session interactive (RemoteCommand + auth par mot de passe), qu'OpenSSH
# refuse pour le transport SSH d'Ansible ("Cannot execute command-line and remote command").
# Se connecter comme d'habitude, puis :
#
#   cd /srv/pass-sport && git pull
#   ansible-playbook -i localhost, -c local deploy/ansible/lamp-setup.yml \
#     --extra-vars @~/pass-sport-secrets.yml
#
# Secrets (SCALINGO_APP, SCALINGO_API_TOKEN) et noms des comptes opérateurs : jamais dans ce
# dépôt, public. Ils arrivent par --extra-vars, depuis un fichier gardé hors dépôt en mode 600
# — voir deploy/ansible/README.md.
#
# Exploitation à deux : un groupe `passsport` réunit le compte de service (qui exécute l'unité
# et la cron, et possède les fichiers) et les comptes humains. Le groupe peut piloter les
# passages qf-batch (start/stop/restart via sudo, cadré au nom d'unité), lire les journaux
# (systemd-journal) et écrire les fichiers de campagne (setgid + umask 007). Il ne peut PAS
# faire `enable`/`disable` — voir templates/pass-sport-sudoers.j2 pour la raison.
#
# Ni qf-batch ni la cron FranceConnect ne démarrent tout seuls à l'issue de ce playbook :
# - l'unité systemd qf-batch@ est déposée mais jamais activée (`systemctl enable`) ni
#   démarrée — chaque passage se déclenche à la main, `systemctl start qf-batch@<partenaire>` ;
# - l'entrée crontab de FranceConnect est posée DÉSACTIVÉE (commentée) par défaut : le
#   premier passage automatique n'a lieu qu'après l'avoir explicitement activée, une fois que
#   l'empreinte SSH Scalingo a été amorcée à la main (voir deploy/ansible/README.md) et qu'un
#   essai à blanc (FC_PROD_DROP_DIR détourné) a été validé.
#
# Cette entrée crontab peut elle-même être sautée en entier (pas seulement posée désactivée)
# avec `--skip-tags fc-cron` — pour rejouer le reste du provisioning, CLI Scalingo comprise,
# avant que le volet FC (jeton, empreinte SSH) soit prêt.
#
# Les tâches sont réparties dans tasks/ (un fichier par section, importé ci-dessous dans
# l'ordre de jeu) : ce fichier ne sert que de sommaire et de définition des variables. Chaque
# fichier de tasks/ porte les commentaires détaillés de ses propres tâches.

- name: Machine de traitement pass Sport
  hosts: localhost
  connection: local
  gather_facts: true

  vars:
    # /srv et non /opt ni un /home : les données de campagne vivent DANS le checkout (CSV
    # partenaires, qf-batch-workdir, parquet, data/.venv, journaux FC). Ce n'est pas du code
    # déployé, c'est un plan de travail partagé — « data for services provided by this
    # system », au sens du FHS. Vérifier que /srv a la place : l'arbre se compte en Go.
    pass_sport_repo: /srv/pass-sport
    pass_sport_group: passsport
    pass_sport_user: passsport          # compte de service : exécute l'unité et la cron
    # Partenaires branchés sur qf-batch (ressource "qf" de l'API Particulier) — pas cnous, qui
    # passe par une autre ressource (voir worker/src/eligibility/types.ts). Source de vérité :
    # le message d'usage de worker/src/scripts/run-qf-batch.sh. Sert à énumérer explicitement
    # les instances pass-sport-qf-batch@<partenaire> autorisées en sudo
    # (templates/pass-sport-sudoers.j2) — le sudoers de la machine de traitement refuse le
    # wildcard `pass-sport-qf-batch@*` qu'on utilisait avant pour les viser toutes d'un coup.
    # Ajouter un partenaire ici puis redéployer à chaque onboarding qf-batch.
    pass_sport_qf_partners:
      - cnaf
      - msa
    # Les deux comptes humains. Vides par défaut : les noms d'opérateurs viennent du fichier
    # hors dépôt (~/pass-sport-secrets.yml), comme les secrets — ce dépôt est public.
    pass_sport_operators: []
    fc_prod_drop_dir: /nfs/postgresql
    # Interrupteur de sécurité : par défaut la cron FC est posée mais désactivée. Activer
    # avec `--extra-vars pass_sport_fc_cron_enabled=true` une fois les prérequis validés
    # (empreinte SSH amorcée, essai à blanc réussi).
    pass_sport_fc_cron_enabled: false
    # Chemin, sous le home de passsport, vers la clé privée que `db-tunnel` doit utiliser —
    # `run_fc_pipeline.sh` retombe sinon sur l'agent SSH puis sur ~/.ssh/id_rsa, qui n'a
    # aucune raison d'exister sous ce compte. Vide par défaut : le playbook ne génère ni ne
    # copie la clé — c'est un geste manuel, au même titre que l'amorçage de l'empreinte SSH
    # (voir deploy/ansible/README.md). Renseigner via
    # `--extra-vars scalingo_ssh_identity=/home/passsport/.ssh/<clé>`.
    scalingo_ssh_identity: ""

  tasks:
    - name: Groupe d'exploitation et comptes
      ansible.builtin.import_tasks: tasks/comptes.yml

    - name: Paquets système
      ansible.builtin.import_tasks: tasks/paquets.yml

    # Avant CLI Scalingo / Node / venv : voir tasks/depot.yml pour pourquoi cet ordre compte.
    - name: Propriétaire du dépôt
      ansible.builtin.import_tasks: tasks/depot.yml

    - name: CLI Scalingo
      ansible.builtin.import_tasks: tasks/scalingo.yml

    - name: Node (apt/NodeSource) et dépendances du worker
      ansible.builtin.import_tasks: tasks/node.yml

    - name: Virtualenv data/.venv
      ansible.builtin.import_tasks: tasks/venv.yml

    # Après Node et venv, pas avant : voir tasks/permissions.yml pour pourquoi cet ordre
    # compte aussi (le miroir exact de la raison qui garde tasks/depot.yml tôt).
    - name: Balayage final des permissions du dépôt
      ansible.builtin.import_tasks: tasks/permissions.yml

    - name: Configuration (pass-sport-fc, dossier de dépôt FC)
      ansible.builtin.import_tasks: tasks/config.yml

    - name: Droits du groupe d'exploitation (sudoers, umask)
      ansible.builtin.import_tasks: tasks/droits-groupe.yml

    - name: Ordonnancement (crontab FC, unité systemd qf-batch)
      ansible.builtin.import_tasks: tasks/ordonnancement.yml

  handlers:
    - name: daemon-reload
      become: true
      ansible.builtin.systemd_service: { daemon_reload: true }
