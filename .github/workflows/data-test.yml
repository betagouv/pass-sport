name: Data tests
on:
  pull_request:
  push:
    branches: [main]
defaults:
  run:
    working-directory: ./data
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: './data/requirements.txt'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Tests
        run: python -m pytest
