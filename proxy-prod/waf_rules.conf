# 1. Ignorer l'inspection stricte sur les fichiers statiques de build de Next.js
SecRule REQUEST_URI "@beginsWith /_next/static/" \
    "id:11001,phase:1,pass,nolog,ctl:ruleEngine=Off"

# 2. Alléger le WAF sur les requêtes de données internes à Next.js
SecRule REQUEST_URI "@beginsWith /_next/data/" \
    "id:11002,phase:1,pass,nolog,ctl:ruleRemoveById=920100-920500"

# 3. Protéger les Server Actions sans bloquer à cause de l'en-tête système Next-Action
SecRule REQUEST_HEADERS:Next-Action ".*" \
    "id:11003,phase:2,pass,nolog,ctl:ruleRemoveById=941000-942999"

# 4. Définir globalement les types de contenu autorisés pour toutes les requêtes
SecAction \
    "id:900220,\
    phase:1,\
    nolog,\
    pass,\
    t:none,\
    setvar:'tx.allowed_request_content_type=|application/x-www-form-urlencoded| |multipart/form-data| |application/json| |text/plain|'"