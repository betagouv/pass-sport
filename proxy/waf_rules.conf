# 1. Ignorer l'inspection stricte sur les fichiers statiques de build de Next.js
SecRule REQUEST_URI "@beginsWith /_next/static/" \
    "id:11001,phase:1,pass,nolog,ctl:ruleEngine=Off"

# 2. Alléger le WAF sur les requêtes de données internes à Next.js
SecRule REQUEST_URI "@beginsWith /_next/data/" \
    "id:11002,phase:1,pass,nolog,ctl:ruleRemoveById=920100-920500"

# 3. Protéger les Server Actions sans bloquer à cause de l'en-tête système Next-Action
SecRule REQUEST_HEADERS:Next-Action ".*" \
    "id:11003,phase:2,pass,nolog,ctl:ruleRemoveById=941000-942999"

# 4. Définir globalement les types de contenu autorisés pour toutes les requêtes
SecAction \
    "id:900220,\
    phase:1,\
    nolog,\
    pass,\
    t:none,\
    setvar:'tx.allowed_request_content_type=|application/x-www-form-urlencoded| |multipart/form-data| |application/json| |text/plain|'"

# 5. Bloquer les tentatives d'accès aux fichiers .php et à /wp-admin/
SecRule REQUEST_URI "@rx (?i)(\.php|/wp-admin/)" \
    "id:10001,\
    phase:1,\
    deny,\
    status:403,\
    log,\
    msg:'Tentative d access refusee a un chemin PHP ou WordPress: %{MATCHED_VAR}'"

# 6. Bloquer les scans WordPress génériques (wlwmanifest.xml, wp-includes/, wp-content/,
#    xmlrpc.php, wp-json/, wp-login.php), quel que soit le préfixe de chemin utilisé
#    (/site/, /blog/, /2019/, etc. sont des prefixes couramment testés par les bots)
SecRule REQUEST_URI "@rx (?i)(wp-includes/|wp-content/|wlwmanifest\.xml|xmlrpc\.php|wp-json/|wp-login\.php)" \
    "id:10002,\
    phase:1,\
    deny,\
    status:403,\
    log,\
    msg:'Tentative de scan WordPress refusee: %{MATCHED_VAR}'"

# 7. Bloquer les tentatives d'accès à des dumps/backups de base de données
SecRule REQUEST_URI "@rx (?i)/(mysql_dump|mysqldump|db_backup|mysql|db|sql_dump|backup|sql|dump)\.sql(\?|$)" \
    "id:10003,\
    phase:1,\
    deny,\
    status:403,\
    log,\
    msg:'Tentative d acces a un dump/backup SQL refusee: %{MATCHED_VAR}'"

# 8. Bloquer les tentatives d'accès aux fichiers de config/secrets sensibles
#    (.env, .git/, credentials AWS/cloud, clés SSH) fréquemment ciblés par les scanners
SecRule REQUEST_URI "@rx (?i)(^|/)(\.env(\.|$|\?)|\.git/|\.aws/credentials|\.ssh/|id_rsa|\.docker/config\.json)" \
    "id:10004,\
    phase:1,\
    deny,\
    status:403,\
    log,\
    msg:'Tentative d acces a un fichier de config/secrets refusee: %{MATCHED_VAR}'"